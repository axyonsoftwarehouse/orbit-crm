name: RLS

# Testes de isolamento entre tenants (tests/rls) contra um Supabase LOCAL
# iniciado no próprio runner (supabase start: migrations + seed). Não usa
# projeto na nuvem nem secrets, e nunca toca a produção.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: Isolamento RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Só os serviços que os testes usam (Postgres, Auth, PostgREST, Storage, Kong).
      - name: Iniciar Supabase local
        run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Exportar credenciais locais
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::supabase status não retornou API_URL/ANON_KEY/SERVICE_ROLE_KEY"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: npm run test:rls

      - if: always()
        run: supabase stop --no-backup
